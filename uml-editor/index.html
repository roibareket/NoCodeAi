<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>UML Editor – visualize code</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<div class="app">
		<main class="canvas-wrap">
			<canvas id="canvas"></canvas>
			<textarea id="inline-body" class="inline-body" placeholder="Type here…" spellcheck="false"></textarea>
		</main>
		<div id="context-menu" class="context-menu" hidden>
			<button type="button" id="context-menu-action">Add item</button>
		</div>
	</div>
	<script src="app.js"></script>
</body>
</html>
